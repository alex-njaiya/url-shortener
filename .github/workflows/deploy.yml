name: Go + React Url shortener Full stack Deployment

on:
  push:
    branches: 
      - main

jobs:
#1. test and deploy go backend app. No test for now
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'


      - name: Install go-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.16.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/migrate

      - name: Run migration on neon
        run: |
          migrate -path ./migrations -database "$DATABASE_URL" up
        env:
          DATABASE_URL: ${{secrets.DATABASE_URL}}

      - name: Build
        run: go build -o app ./cmd/server

      - name: Deploy to render
        run: |
          curl -X POST "https://render.com{{ secrets.RENDER_SERVICE_ID }}?key={{  secrets.RENDER_API_KEY }}"
